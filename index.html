<script>
const CATS=["💼 职场事业","👥 人际交往","😔 情绪心理","👨‍👩‍👧 家庭关系","📈 自我成长","💰 消费理财","🫀 身心健康"];
const CATS_EN=["Work","Social","Emotion","Family","Growth","Money","Health"];

// ========== 300 条问答库 ==========
// [困境, 古人原文, 出处, 白话, English, 今日心法, Heart, 分类0-6]
const Q=[
["同事太卷我怎么办","为人之所为者，人亦无疵焉，是之谓与人为徒。成而上比者，与古为徒。","庄子·人间世","做好分内事，不与人争短长。内守其志，外顺其流。","Do your part without competing. Guard your inner purpose while flowing with the current.","外面随俗，内里守界","Blend in outwardly, stand firm inwardly",0],
["想辞职又怕找不到更好的","君子藏器于身，待时而动","周易·系辞","不是不能辞，是你现在手里有没有'器'。没有就先藏着，一边上班一边磨。","Don't quit empty-handed. Build your arsenal first, then act when the moment is right.","辞的是职，不是底气","Quit the job, not your confidence",0],
["开会时不敢发言怕说错","上善若水，水善利万物而不争","道德经·第八章","水不争高下，但水永远在场。你不用抢着当主角，先学会'在场'，再学会'发声'。","Water never competes, yet it's always present. Learn to be present before learning to speak up.","先在场，再发声","Be present first, speak later",0],
["同事升职比我快心里不平衡","小知不及大知，小年不及大年","庄子·逍遥游","他的'年'是升职速度，你的'年'是专业深度。别用别人的尺子量自己的命。","His timeline is promotion speed; yours is professional depth. Don't measure your life with another's ruler.","各走各的年","Walk your own path",0],
["被领导当众批评很难堪","就不欲入，和不欲出","庄子·人间世","当众批评是面子，保住工作是里子。面子丢了能捡，里子丢了难补。忍的是气，不是志。","Public criticism is face; keeping the job is substance. Endure the anger, not the ambition.","忍的是气，不是志","Endure the anger, keep the ambition",0],
["想搞副业但时间精力不够","吾生也有涯，而知也无涯","庄子·养生主","生有涯，精力更有涯。副业不是加法，是减法——先砍掉无效社交，再谈副业。","Life has limits, so does energy. Side hustle means subtraction—cut useless socializing first.","精力是零和游戏，先减后加","Energy is zero-sum; subtract before adding",0],
["被领导阴阳怪气怎么接","天下之至柔，驰骋天下之至坚","道德经·第四十三章","舌头软，牙齿硬，老了牙齿掉光舌头还在。你越软，他的硬话越没着力点。","The soft tongue outlasts the hard teeth. The softer you are, the less purchase their harsh words have.","软不是弱，是无着力点","Softness is not weakness; it leaves no grip",0],
["公司裁员怕被优化","死生，命也；其有夜旦之常，天也","庄子·大宗师","裁员像昼夜交替，是公司的'天'，不是你的'命'。你只是换了个白天。","Layoffs are like day and night—the company's nature, not your fate. You're just changing your morning.","公司的天，不是你的命","Company's nature, not your destiny",0],
["想拒绝额外工作怕得罪人","毋意，毋必，毋固，毋我","论语·子罕","不臆测对方会生气，不必须答应，不固执己见，不只考虑自己。温和说'我手头有XX，下周行吗？'","Don't assume they'll be angry, don't feel you must say yes. Gently offer an alternative timeline.","拒绝的是事，不是人","Refuse the task, not the person",0],
["领导让我做假账怎么办","凫胫虽短，续之则忧；鹤胫虽长，断之则悲","庄子·骈拇","你的'胫'是底线，断了就再也长不回。宁可被骂死板，别让自己短命。","Your bottom line is like a leg—once broken, it never grows back. Better to be called rigid than to lose yourself.","底线是胫，断了难续","Bottom line broken can't be mended",0],
["同事总让我帮忙取快递带饭","知人者智，自知者明","道德经·第三十三章","知道同事需要什么是智，知道自己的边界在哪是明。第一次就温和拒绝，比第十次容易。","Knowing others' needs is wisdom; knowing your boundaries is insight. A gentle refusal the first time beats the tenth.","第一次拒绝是明，第十次是累","First refusal is wise; tenth is burnout",0],
["想转行又怕从零开始","潜龙勿用","周易·乾卦","转行不是飞龙在天，是潜龙勿用。先偷偷学，再慢慢动，别一上来就辞职。","Career change is not flying high—it's the hidden dragon. Learn quietly, move gradually; don't quit first.","潜龙不是废，是蓄势","The hidden dragon isn't useless; it's charging up",0],
["领导偏心给同事更多机会","井蛙不可以语于海者，拘于虚也","庄子·秋水","领导的海里，你只是井蛙。不是你不够好，是他的井太小。","In the leader's ocean, you're a frog in a well. It's not that you're not good enough; his well is just too small.","不是你不行，是他的井太小","It's not you—his perspective is limited",0],
["想考证提升自己又没时间","发愤忘食，乐以忘忧","论语·述而","不是没时间，是你把刷手机的时间当成了放松。考证不是苦役，是乐事。","It's not that you have no time—you treat phone scrolling as rest. Certification isn't drudgery; it's joy.","时间像海绵，挤的是无效放松","Time is a sponge; squeeze out mindless scrolling",0],
["同事抢我功劳想找领导告状","不刻意而高，无仁义而修","庄子·刻意","功劳像风，你追它它跑；你种树，它自己来。先把自己的树种好，风自然会吹过来。","Credit is like wind—chase it, it flees; plant your tree, it comes. Grow yourself first.","追功劳是刻意，种能力是自然","Chasing credit is forced; building skill is natural",0],
["公司团建不想去怕不合群","与人为徒","庄子·人间世","与人为徒不是每场都去，是去了不扫兴、不去不解释。找个借口说家里有事。","Blending in doesn't mean showing up every time. Go without ruining the mood; skip without over-explaining.","合群是选择，不是必须","Fitting in is a choice, not an obligation",0],
["想给领导提建议又怕被穿小鞋","天子之剑，以燕谿石城为锋","庄子·说剑","提建议像出剑，锋芒太露容易伤己。先私下说，用'我有个想法'开头。","Giving advice is like drawing a sword—too sharp, you cut yourself. Say it privately, start with 'I have an idea.'","剑要出鞘，先藏锋","Before drawing the sword, hide the edge",0],
["同事离职想跟着走","德不孤，必有邻","论语·里仁","同事走了你的德还在，自然有新邻。别因为别人走，就觉得自己该走。","When colleagues leave, your virtue remains. New neighbors will come. Don't follow just because others left.","邻是德带来的，不是跟着来的","Neighbors come with virtue, not by following",0],
["领导让加班我想陪家人","帝王之功，圣人之余事也","庄子·让王","加班是帝王之功（公司的事），陪家人是圣人之事（你的事）。余事可以放，正事不能丢。","Overtime is the empire's business; family is the sage's work. The former can wait, the latter cannot.","公司事是余，家事是正","Work is secondary; family is primary",0],
["想跳槽到竞争对手公司","将欲取之，必固与之","道德经·第三十六章","跳之前先想清楚你从现在的公司取了什么——经验、人脉、能力。没取够就跳，容易空手赴敌。","Before jumping, know what you've gained here—experience, connections, skills. Leave only when you've taken enough.","跳槽不是逃，是取足而走","Job-hopping isn't fleeing; it's leaving fully equipped",0],
["同事总抱怨公司我该附和吗","形莫若就，心莫若和","庄子·山木","表面上点点头（形就），心里别跟着怨（心和）。附和多了，你会变成你讨厌的人。","Nod outwardly, but don't let resentment take root inside. Echo complaints long enough, you become them.","嘴可以就，心不能和","Mouth may nod; heart must not follow",0],
["想创业又怕失败","屯，刚柔始交而难生","周易·屯卦","创业像屯卦，刚柔刚开始交，肯定难。难不是失败，是开始。","Starting up is like the Tun hexagram—difficulty at the beginning. Difficulty is not failure; it's the start.","难是开始，不是终点","Difficulty is the beginning, not the end",0],
["领导说以后不会亏待你，信吗","巧者劳而知者忧，无能者无所求","庄子·列御寇","巧者劳，知者忧，无能者反而无所求。别等以后，现在的回报才是真的。","The capable labor, the wise worry, the unambitious want nothing. Don't wait for later—today's reward is real.","以后是饼，现在是饭","Later is a promise; now is the meal",0],
["上班如上坟完全没有热情","知其不可奈何而安之若命","庄子·人间世","如果暂时无法改变，就先接纳。把工作当成修行的道场，在乏味中找到你自己的节奏。","If you can't change it now, accept it. Treat work as your training ground; find your rhythm within the tedium.","工作是道场，乏味是修行","Work is the temple; tedium is the practice",0],
["上司经常改需求导致加班","合抱之木，生于毫末；九层之台，起于累土","道德经·第六十四章","大事从小处着眼。每次确认需求前多沟通三分钟，把毫末理清，后面的大树才不会长歪。","Great things start small. Clarify for three more minutes each time—the tiny roots decide whether the tree grows straight.","多问三分钟，少加三小时","Ask three more minutes, save three more hours",0],
["面试失败很沮丧","飘风不终朝，骤雨不终日","道德经·第二十三章","狂风不会刮一早上，暴雨不会下一整天。面试失败只是一阵风，不是整个季节。","No storm lasts all morning. This rejection is just a gust, not the whole season.","失败是阵风，不是季节","Rejection is a gust, not the season",0],
["同事借钱不还，要不要催","人而无信，不知其可也","论语·为政","他失了信，你守了义。催一次是提醒，催两次是底线，催三次就当买个教训。","He lost trust; you kept integrity. Remind once, draw the line twice, treat the third as a lesson bought.","钱是试金石，试的是信","Money is a touchstone for trust",1],
["亲戚催婚烦不胜烦","鹪鹩巢于深林，不过一枝","庄子·逍遥游","你的人生像鹪鹩的巢，只需要一枝，不是整片森林。亲戚的森林，不是你的枝。","You only need one branch, not the whole forest. Their forest is not your branch.","你的枝，自己选","Your branch, your choice",1],
["朋友聚会我不知道说什么","知者不言，言者不知","道德经·第五十六章","不知道说什么时就听。听是大知，抢着说是小知。","When you don't know what to say, listen. Listening is great wisdom; rushing to speak is petty cleverness.","听是金，说是银","Listening is gold; speaking is silver",1],
["被人误解想拼命解释","辩也者，有不辩也","庄子·齐物论","解释是辩，有些事不辩更清楚。时间会替你说话，不用急着张嘴。","Some truths are clearer without debate. Time will speak for you—don't rush to open your mouth.","解释是辩，时间是证","Argument debates; time proves",1],
["朋友升职我嫉妒得睡不着","己欲立而立人，己欲达而达人","论语·雍也","你想立，先帮朋友立；你想达，先帮朋友达。嫉妒是堵，成全是通。","You want to rise? First help your friend rise. Envy is blockage; generosity is flow.","嫉妒是堵，成全是通","Envy blocks; generosity flows",1],
["同事总在群里@我很烦","至人之用心若镜，不将不迎","庄子·应帝王","群消息像镜子里的像，来了不迎，走了不送。看到就回，没看到就当没发生。","Messages are reflections in a mirror—don't welcome or resist them. Reply if you see; let go if you don't.","消息是镜中像，别往心里去","Messages are reflections; don't take them to heart",1],
["被人背后说坏话想报复","万物负阴而抱阳，冲气以为和","道德经·第四十二章","坏话是阴，你的平静是阳。阴阳冲气自然和解。报复是加阴，只会更乱。","Gossip is yin; your calm is yang. They naturally reconcile. Revenge adds more yin—only makes things messier.","报复是加阴，平静是抱阳","Revenge adds darkness; calm embraces light",1],
["朋友约我帮忙我不想帮","邦有道，则仕；邦无道，则可卷而怀之","论语·卫灵公","朋友的事像邦，有道就帮，无道就卷而怀之——温和拒绝。","A friend's request is like a state—serve when it's right, withdraw gracefully when it's not.","帮是仕，不帮是怀","Help is service; refusal is grace",1],
["觉得别人都不懂我","以道观之，物无贵贱","庄子·秋水","用道看，你和别人都一样；用尺子看，你永远不够好。扔掉别人的尺子。","From the Tao's view, you're equal to all. Stop measuring yourself with others' rulers.","尺子是别人的，人生是自己的","Their ruler; your life",1],
["想和领导搞好关系又怕被说拍马屁","就不欲入，和不欲出","庄子·人间世","靠近领导但不入（不谄媚），和谐但不张扬。默默把事做好比说十句好话有用。","Stay close but not fawning; be harmonious but not showy. Quietly doing the work beats ten flattering words.","近是就，谄是入","Close is proximity; flattery is intrusion",1],
["朋友失恋我不知道怎么安慰","飘风不终朝，骤雨不终日","道德经·第二十三章","失恋像狂风暴雨，不会一直下。你不用止雨，只要陪他撑伞。","Heartbreak is a storm that won't last forever. You don't need to stop the rain—just hold the umbrella.","不用止雨，只需撑伞","Don't stop the rain; hold the umbrella",1],
["被人调侃暗讽不知怎么回","狗不以善吠为良，人不以善言为贤","庄子·徐无鬼","会叫的狗不是好狗，会说的人不是贤人。调侃你的人只是善吠，你不用当真。","Barking dogs aren't good dogs; talkative people aren't wise ones. Those who mock you are just barking.","调侃是吠，你不是狗","Their mockery is barking; you're not a dog",1],
["想加喜欢的人的微信不敢","见义不为，无勇也","论语·为政","喜欢是义，不敢加是无勇。加了可能被拒，不加一定后悔。","Liking is righteous; not adding is cowardice. Added, you might be rejected; not added, you'll certainly regret.","勇是加，悔是不加","Courage is adding; regret is not",1],
["朋友总跟我抱怨公司听得很累","君子之交淡若水，小人之交甘若醴","庄子·山木","君子之交像水，淡但长久；小人之交像甜酒，甜但易腻。听抱怨是醴，适当抽离是水。","Noble friendship is like water—plain but lasting. Listening to complaints is sweet wine; stepping back is water.","听是醴，抽离是水","Listening is sweet wine; distance is water",1],
["老朋友渐行渐远心里难过","泉涸，鱼相与处于陆，相呴以湿，相濡以沫，不如相忘于江湖","庄子·大宗师","两条鱼用唾沫互相湿润，不如在江湖里互相忘记。有些人相忘于江湖，不是遗憾，是自然。","Two fish moistening each other with spit is painful kindness. Better to forget each other in the vast river—it's not loss, it's nature.","相忘于江湖，不是遗憾","Forgetting in the river isn't loss—it's nature",1],
["总觉得别人在背后议论我","举世誉之而不加劝，举世非之而不加沮","庄子·逍遥游","全世界夸你你不多做，全世界骂你你不少做。你的价值不在别人的嘴里。","Praised by the world, you don't try harder; condemned, you don't wilt. Your worth isn't in others' mouths.","价值在己，不在人言","Your worth is yours, not others' words",1],
["微信被人拉黑很受伤","来而不往，亦非礼也","礼记·曲礼","不是每个人都需要走进你的生活，离开也是一种礼物。把被删除的页面关掉，你还有新的一页。","Not everyone belongs in your life. Departure can be a gift. Close the deleted page; you have new ones waiting.","拉黑是别人的，平静是你的","Being blocked is theirs; peace is yours",1],
["女友/男友老是翻旧账","往者不可谏，来者犹可追","论语·微子","旧账像翻旧报纸，翻不出新日子。对TA说：过去的报纸我已经回收了，今天我们读新的一页。","Old accounts are yesterday's newspapers. Say: I've recycled those pages. Let's read today's together.","旧账是报纸，今天是新页","Old accounts are old papers; today is a fresh page",1],
["亲戚总拿我和别人比较","以道观之，物无贵贱","庄子·秋水","比较是亲戚的尺子，你用道的眼光看，万物平等。你不需要活在别人的坐标系里。","Comparison is their ruler. Through the Tao, all things are equal. You don't need to live in anyone else's grid.","尺子是别人的，坐标是自己的","Their ruler; your coordinates",1],
["觉得自己社交能力差很自卑","大音希声，大象无形","道德经·第四十一章","最好的音乐听不见，最大的形象看不清。安静的人往往最有力量，不必强迫自己变成话痨。","The greatest sound is silent; the greatest form is invisible. Quiet people often have the most power—don't force yourself to be chatty.","安静是力量，不是缺陷","Silence is power, not a flaw",1],
["总担心未来睡不着","死生，命也；其有夜旦之常，天也","庄子·大宗师","生死都天天在，未来只是未到的现在。睡好今天的觉，就是给未来最好的准备。","Life and death come daily; the future is just a not-yet-arrived now. Sleep well tonight—that's the best preparation.","未来是未到的现在","The future is the not-yet now",2],
["后悔过去的事反复想","往者不可谏，来者犹可追","论语·微子","过去的像泼出去的水追不回，未来的像田里的苗还能种。别盯着水，去种苗。","The past is spilled water; the future is a field to sow. Stop staring at water—start planting.","过去是水，未来是苗","Past is water; future is seeds",2],
["觉得自己不如别人自卑","人法地，地法天，天法道，道法自然","道德经·第二十五章","海比河大，但河有河的美。你不是海，你是你自己的川。","The sea is bigger than the river, but the river has its own beauty. You are not the sea; you are your own stream.","你是川，不是海","You're a stream, not the sea",2],
["怕别人不喜欢我","善者吾善之，不善者吾亦善之","道德经·第四十九章","喜欢我的人我善待，不喜欢我的人我也善待。不是讨好，是我本善。","Those who like me I treat well; those who don't I treat well too. Not to please—because kindness is who I am.","喜欢是他的事，善是我的事","Liking is theirs; kindness is mine",2],
["吃饭也焦虑总是吃不好","忘足，履之适也；忘要，带之适也","庄子·达生","脚忘了鞋，鞋才舒服；腰忘了带，带才舒服。你忘了焦虑，饭才香。","When feet forget the shoes, shoes fit. When you forget anxiety, food tastes good.","忘焦虑，饭自香","Forget anxiety; food becomes fragrant",2],
["总觉得自己做错事","过而不改，是谓过矣","论语·卫灵公","错了就改，别怕改。怕改的错才是真错，改了的错是经验。","Mistakes corrected are no longer mistakes. The real mistake is being afraid to correct them.","错是经验，怕改是真错","Mistakes are lessons; fear of correction is the real error",2],
["看到别人优秀心里酸","直木先伐，甘井先竭","庄子·山木","优秀的树先被砍，甜的井先被喝。你酸的不是优秀，是先伐。","The straightest tree is cut first; the sweetest well is drained first. You're not envious of excellence—you're wary of being targeted.","酸的是先伐，不是优秀","Envying the cutting, not the excellence",2],
["总担心生病疑神疑鬼","出生入死，生之徒十有三","道德经·第五十章","人从生到死本来就有风险。担心不会减少风险，只会减少快乐。","Risk is built into living. Worrying doesn't reduce risk—it only reduces joy.","担心不减少风险，只减少快乐","Worry reduces joy, not risk",2],
["觉得自己一事无成","有实而无乎处者，宇也；有长而无本剽者，宙也","庄子·庚桑楚","宇宙有实无界，有时间无始终。现在的无成只是宇宙里的一粒尘，不是全部。","The universe has substance without boundary, time without beginning. Your current failures are just dust in the cosmos—not everything.","无成是尘，不是宇宙","Failure is dust, not the universe",2],
["为小事烦躁不安","一箪食，一瓢饮，在陋巷，人不堪其忧，回也不改其乐","论语·雍也","颜回的箪食瓢饮是小事，你的堵车迟到也是小事。小事像灰尘，擦掉就好。","Yan Hui's simple meals were small things; your traffic jams are too. Small things are like dust—wipe them away.","小事是尘，擦掉就好","Small things are dust; wipe and move on",2],
["觉得孤独没人理解","相呴以湿，相濡以沫，不如相忘于江湖","庄子·大宗师","两条鱼在陆地上用唾沫互相湿润，不如在江湖里互相忘记。孤独时先学会和自己相忘。","Two stranded fish moistening each other with spit—better to forget in the river. In loneliness, learn to forget yourself first.","孤独是江湖，不是陆地","Loneliness is the river, not the shore",2],
["总觉得自己不够努力","希言自然，故飘风不终朝","道德经·第二十三章","狂风不会刮一早上，努力也不用每天狂风。偶尔慢下来，是自然。","Storms don't last all morning. You don't need to storm every day. Slowing down sometimes is natural.","努力不是狂风，是常风","Effort isn't a storm; it's a steady breeze",2],
["被人否定怀疑自己","举世誉之而不加劝，举世非之而不加沮","庄子·逍遥游","全世界夸你你不多做，全世界骂你你不少做。你的价值不在别人的嘴里。","Praised by all, you don't try harder; condemned by all, you don't wilt. Your worth isn't spoken by others.","价值在己，不在人言","Worth is intrinsic, not spoken",2],
["有时莫名想哭却没有理由","真者，精诚之至也。不精不诚，不能动人","庄子·渔父","想哭不需要理由，那是你灵魂在浇水。真正的精诚不是永远坚强，是允许自己脆弱。","Crying needs no reason—it's your soul watering itself. True sincerity isn't always being strong; it's allowing weakness.","想哭就哭，泪水也是精诚","Cry if you must; tears are also sincerity",2],
["觉得自己性格不好","马蹄可以践霜雪，毛可以御风寒","庄子·马蹄","马蹄天生踩霜雪，马毛天生御风寒。你的性格天生有用，不用改，只需用对地方。","Hooves tread frost; fur shields cold. Your personality is born useful—don't change it, just apply it right.","性格是马蹄，用对地方就好","Personality is the hoof; use it right",2],
["错过好机会很懊悔","反者道之动，弱者道之用","道德经·第四十章","道是循环的，错过的机会会反回来。现在没抓住，可能是弱用——下次更强。","The Tao cycles; missed chances return. Not seizing now may be weakness—but it readies strength for next time.","错过是反，下次是动","Missing is the return; next time is the motion",2],
["总觉得自己运气差","知其不可奈何而安之若命","庄子·人间世","运气像天气，有晴有雨。你改变不了天气，但可以改变心情。安之若命，就是好运气。","Luck is weather—sun and rain. You can't change the weather, but you can change your mood. Accepting fate peacefully is good luck.","运气是天气，心情是自己","Luck is weather; mood is yours",2],
["接收到别人的坏情绪很难受","非礼勿视，非礼勿听，非礼勿言，非礼勿动","论语·颜渊","别人的坏情绪是非礼，不看、不听、不说、不动，就是最好的保护。","Others' bad moods are improper—don't look, don't listen, don't speak, don't engage. That's the best protection.","坏情绪是非礼，不接就是礼","Bad moods are improper; not receiving them is proper",2],
["总觉得自己活得太累","纯粹而不杂，静一而不变","庄子·刻意","累是因为杂，不累是因为纯。砍掉不必要的社交、欲望，回到纯粹。","Exhaustion comes from clutter; ease from purity. Cut unnecessary socializing and desires. Return to simplicity.","累是杂，纯是静","Exhaustion is clutter; purity is peace",2],
["总担心老去很恐惧","吾生也有涯，而知也无涯","庄子·养生主","养生像种树，年轻时啬（积蓄），老了才有果。现在开始存健康不算晚。","Nurturing life is like growing a tree—save up when young to bear fruit when old. It's never too late to start.","老是果，现在是啬","Old age is the fruit; now is the planting",2],
["找不到人生意义很空虚","独与天地精神往来","庄子·天下","意义不是别人给的，是自己和天地往来。看一朵花，听一阵风，就是意义。","Meaning isn't given by others—it's communion with heaven and earth. Watching a flower, hearing a breeze—that's meaning enough.","意义是往来，不是给","Meaning is communion, not assignment",2],
["害怕孤独终老","德不孤，必有邻","论语·里仁","有德者不会孤独，真正的邻居是精神上的。你若盛开，蝴蝶自来。","The virtuous are never alone. True neighbors are spiritual. Blossom, and butterflies will come.","德不孤，蝴蝶自来","Virtue attracts companions; bloom and they come",2],
["觉得努力没有回报想放弃","不积跬步，无以至千里","荀子·劝学","千里路是一步一步走出来的，你看不见终点是因为离得太近。低头走好每一步，抬头时已经过万重山。","A thousand miles is made of single steps. You can't see the end because you're too close. Walk each step well.","走好每一步，抬头已千里","Walk each step; look up and you've gone far",2],
["被最信任的人背叛很痛苦","不逆诈，不亿不信，抑亦先觉者，是贤乎","论语·宪问","不预先怀疑别人欺诈，但一旦发现，要有先觉的智慧。被骗不是你的错，继续信任才是你的勇气。","Don't pre-suspect deceit—but discern it when it comes. Being betrayed isn't your fault; continuing to trust is your courage.","被骗不是错，继续信是勇","Betrayal isn't your fault; trusting again is courage",2],
["觉得自己脾气暴躁控制不住","忿思难","论语·季氏","发怒之前想后果。那把火最先烧的是你自己。深呼吸十秒，让怒气散一散。","Before anger, think of consequences. The fire burns you first. Breathe ten seconds; let it dissipate.","怒火先烧己，深呼吸再决定","Anger burns you first; breathe before deciding",2],
["父母催婚怎么应对","马蹄可以践霜雪，毛可以御风寒","庄子·马蹄","马有马的活法，人有人的节奏。父母的催是霜雪，你的节奏是毛——天生就能御寒。","Horses have their way; people have their rhythm. Parents' pressure is frost; your rhythm is fur—born to withstand the cold.","催是霜雪，节奏是毛","Pressure is frost; your rhythm is fur",3],
["对父母态度不好很愧疚","色难。有事弟子服其劳，有酒食先生馔，曾是以为孝乎","论语·为政","对父母和颜悦色最难。先改脸色，再改沟通。","A pleasant face toward parents is the hardest. Fix your expression first, then your words.","沟通先改色，再改话","Fix your face before your words",3],
["不知道如何表达对家人的关心","天下之至柔，驰骋天下之至坚","道德经·第四十三章","关心不是说，是柔。一个拥抱比十句我关心你有用。","Care isn't spoken—it's gentle. One hug beats ten verbal expressions of concern.","关心是柔，不是说","Care is gentleness, not words",3],
["怎么和强势的父母相处","形莫若就，心莫若和","庄子·山木","表面听（形就），心里守（心和）。不对抗不盲从，就是最好的边界。","Listen on the surface, but guard your heart. Don't fight or blindly follow—that's the best boundary.","听是就，守是和","Listening is yielding; guarding is harmony",3],
["孩子不听话很头疼","其身正，不令而行；其身不正，虽令不从","论语·子路","你正，孩子自然正；你不正，逼他也没用。先当正的父母，再当管的父母。","If you're upright, children follow without orders. Fix yourself before fixing them.","正己，才能正孩子","Rectify yourself to guide your child",3],
["夫妻间总是互相挑剔","以道观之，物无贵贱","庄子·秋水","用道看，你和别人都一样；用配偶的尺子看，你永远不够好。扔掉尺子，抱抱他。","Through the Tao, all are equal. Through your spouse's ruler, you're never enough. Drop the ruler and hug.","尺子是他的，拥抱是你的","The ruler is theirs; the embrace is yours",3],
["父母说为你好让我很窒息","其耆欲深者，其天机浅","庄子·大宗师","忌讳越多，人越贫乏。为你好越多，你越不自由。温和说我知道，但我要自己的好。","More taboos make a poorer person. More 'for your own good' means less freedom. Gently say: I know, but I want my own good.","为你好是忌讳，自由是你的事","Their good is their taboo; freedom is yours",3],
["无法摆脱原生家庭的影响","物无非彼，物无非是","庄子·齐物论","你的彼是过去，孩子的是是现在。别用自己的是绑孩子的彼。","Their 'that' is the past; your 'this' is the present. Don't bind your present with their past.","彼是过去，是是现在","That is past; this is now",3],

["觉得自己太内向不会社交","刚毅木讷，近仁","论语·子路","孔子说刚强、坚毅、不善言辞的人接近仁。内向不是缺陷，是天赋——你不需要变成别人。","Confucius said: firm, resolute, and inarticulate people are close to benevolence. Introversion isn't a flaw—it's a gift. You don't need to become someone else.","内向近仁，不需要变","Introversion is near virtue; don't change",4],
["婚后的生活太平淡了没激情","君子之道，淡而不厌","中庸","君子的道平淡但不让人厌倦。婚前是烟花，婚后是长明灯。平淡才是最深的浪漫。","The noble path is plain but never dull. Before marriage was fireworks; after is an eternal lamp. Plainness is the deepest romance.","淡而不厌，平淡是长明灯","Plain but not dull; steadiness is the eternal lamp",3],
["周围的人都在买房我很焦虑","鹪鹩巢于深林，不过一枝；偃鼠饮河，不过满腹","庄子·逍遥游","鸟巢只需一根枝，老鼠喝水只需满肚子。房子再大也只睡一张床。按自己的节奏来。","A bird needs just one branch; a mouse drinks only till full. No matter the house, you sleep in one bed. Follow your own rhythm.","一枝一腹，房子是巢不是枷锁","One branch, one belly; home is nest, not cage",5],
["工作中遇到瓶颈无法突破","山径之蹊间，介然用之而成路","孟子·尽心","山间小路走多了就成了大路。瓶颈是因为你在同一条路上走太久——试试旁边那条小径。","A mountain path becomes a road through use. Stuck because you've walked the same path too long—try the side trail.","瓶颈是路走窄了，换条小径","Stuck means the path is narrow; try a side trail",0],
["退休了不知道干什么很空虚","发愤忘食，乐以忘忧，不知老之将至","论语·述而","找到一件让你废寝忘食的事，你就不知老之将至。六岁开始练字不晚，六十岁也不晚。","Find something that makes you forget meals; you won't notice age coming. Starting calligraphy at six isn't too late—neither is sixty.","不知老之将至，找到乐事","Unaware of aging; find your joy",4],
["被诊断出慢性病觉得天塌了","死生亦大矣","庄子·德充符","死生是大事，但庄子见过更大的东西——道。疾病改变的是生活方式，不是生命的价值。","Life and death are great—but Zhuangzi saw something greater: the Tao. Illness changes lifestyle, not life's value.","疾病改生活方式，不改生命价值","Illness changes how you live, not your worth",6],
["同事故意不告诉我重要信息","以直报怨，以德报德","论语·宪问","用正直回报怨恨，用恩德回报恩德。他不告诉你是他的失，你继续保持专业是你的直。","Repay resentment with fairness, kindness with kindness. Their withholding is their fault; your continued professionalism is your fairness.","以直报怨，专业是最好的回击","Fairness for resentment; professionalism is the best response",0],
["总想活成别人眼中的样子","我则异于是，无可无不可","论语·微子","我跟他们不一样，没什么必须的也没什么不行的。活成别人眼中的样子是最累的事。","I'm different from them—nothing is must, nothing is can't. Living as others see you is the most exhausting thing.","无可无不可，做自己最轻松","Nothing must be, nothing can't be; being yourself is easiest",2],
["亲人突然离世接受不了","逝者如斯夫，不舍昼夜","论语·子罕","河水昼夜不停，时间不会因为你的悲伤暂停。但河水会带着你的思念一直流下去。","The river flows day and night; time won't pause for your grief. But the river will carry your memories forward forever.","逝者如斯，带爱往前","Time flows like water; carry love forward",2],
["总是忍不住和别人比惨","君子周而不比，小人比而不周","论语·为政","君子团结但不攀比，小人攀比但不团结。比惨是精神内耗，团结是一起变好。","Nobles unite without comparing; small people compare without uniting. Misery contests drain spirit; unity builds everyone.","团结不攀比","Unite, don't compare",2],
["别人总觉得我高冷难以接近","君子泰而不骄，小人骄而不泰","论语·子路","君子安详而不傲慢，小人傲慢而不安详。别人觉得你高冷是因为他们只看表面。真正了解你的人不需要你解释。","Nobles are composed without arrogance; small people are arrogant without composure. Those who think you're cold only see the surface. Those who know you need no explanation.","泰而不骄，不必解释","Composed without pride; no need to explain",1],
["害怕衰老带来的各种不便","老吾老以及人之老","孟子·梁惠王","自己会老，所以更要善待现在的老人。你今天的善意，是为未来的自己铺路。","You'll age too, so treat the elderly kindly now. Today's kindness paves the road for your future self.","善待老人就是善待未来的自己","Care for the old is care for your future self",6],
["觉得自己记性越来越差了","温故而知新，可以为师矣","论语·为政","记性差不重要，重要的是你愿不愿意一遍遍温习。古人背书百遍，不在乎记不记得住。","Bad memory doesn't matter—what matters is willingness to review. The ancients recited a hundred times, not caring about retention.","温故知新，不在乎记忆","Review the old to know the new; memory is secondary",4],
["不知道要不要结束这段感情","道不同，不相为谋","论语·卫灵公","方向不同就不必勉强同行。不是在否定过去，是在尊重未来。","Different paths don't need to walk together. It's not denying the past—it's respecting the future.","道不同不相为谋","Different paths, different journeys",3],
["感觉父母的爱是有条件的","父母唯其疾之忧","论语·为政","父母只担心你生病——这才是他们爱的核心。其他条件是附加的焦虑，不是爱的本质。","Parents only truly worry about your illness—that's the core of their love. Other conditions are added anxieties, not love's essence.","爱的核心是担忧，条件是焦虑","Love's core is worry; conditions are anxiety",3],
["总想从头开始又不知道从哪开始","千里之行，始于足下","道德经·第六十四章","不需要想清楚全程，只需要迈出第一步。路是走出来的，不是想出来的。","You don't need to see the whole path—just take the first step. Roads are walked, not thought into existence.","始于足下，先走第一步","Start at your feet; take the first step",4],
["经期前情绪特别暴躁","喜怒哀乐之未发，谓之中","中庸","情绪没有发出来的时候叫中。经期不是你的错，但你可以温柔地告诉身边的人：我这几天需要多一点空间。","Before emotions erupt, there is equilibrium. Your period isn't your fault—gently tell those around you: I need a bit more space these days.","未发是中，温和告知","Before eruption is center; gently inform",6],
["被别人拿来和兄弟姐妹比较","君子不器","论语·为政","你不是一件器物，不是用来和别人比较的工具。你有你的形状和用处。","You're not a vessel—not a tool for comparison. You have your own shape and purpose.","你不是器，不需要比较","You're not a tool; no comparison needed",2],
["看着别人成双成对自己单身焦虑","德不孤，必有邻","论语·里仁","有德者不会孤单。先把自己的生活过得丰盛，对的人会闻香而来。","The virtuous are never alone. Enrich your own life first—the right person will be drawn by the fragrance.","德不孤，闻香自来","Virtue attracts; fragrance brings them",1],
["想离开舒适圈又不敢","穷则变，变则通，通则久","周易·系辞","堵住了就变，变了就通，通了就长久。舒适圈之所以叫圈，是因为它有边界——走出去边界就扩大了。","Blocked, change; changed, flow; flowing, endure. The comfort zone is a zone because it has boundaries—step out, and the boundaries expand.","穷则变，变则通","Blocked, change; changed, flow",4],
["被别人抢了功劳很愤怒","不患无位，患所以立","论语·里仁","不怕没有位置，怕你没有能力自立。被抢的功劳今天能抢，但你的能力谁也抢不走。","Don't worry about lacking position—worry about lacking the ability to stand. Credited stolen can be taken now, but your ability can never be taken.","功劳可抢，能力不可夺","Credit can be stolen; ability cannot",0],
["总是间歇性踌躇满志持续性混吃等死","一鼓作气，再而衰，三而竭","左传·曹刿论战","第一鼓士气最旺，第二次就衰了。不要一直等下一鼓，把你现在的冲动变成一个小行动。","First drum brings peak morale; the second weakens. Don't wait for the next drum—turn this impulse into one small action now.","一鼓作气，现在行动","First drum's spirit; act now",4],
["人到三十突然很焦虑","三十而立","论语·为政","孔子的三十而立不是有车有房，是立起自己的价值观。你立了什么？立了就行，不用跟别人比。","Confucius's 'standing at thirty' isn't about house and car—it's standing on your values. What have you stood on? If you have, you've made it.","三十而立，立的是价值观","Standing at thirty means standing on values",4],
["总觉得对不起自己的家人","往者不可谏，来者犹可追","论语·微子","过去对家人的亏欠已成过往，未来还有无数个日子可以弥补。从今天的一个电话开始。","Past deficits to family are behind you; countless future days remain to make up. Start with one phone call today.","来者可追，从今天开始","The future can be caught; start today",3],
["想知道如何快速走出失恋","苟日新，日日新","大学·汤之盘铭","每天都洗一次心——不是抹掉过去，是让伤口结新痂。每天做一件分手前没做过的事。","Cleanse your heart each day—not erasing the past, but forming new scabs. Do one thing daily you never did before the breakup.","日日新，每天做一件新事","Renew daily; do one new thing each day",2],
["夫妻之间越来越没话说","君子之交淡若水","庄子·山木","淡若水不是没话说，是说废话也觉得舒服。不说话坐在一起也不尴尬，才是最高境界。","Plain as water doesn't mean silent—it means even silence is comfortable. Sitting together without needing to speak is the highest state.","淡若水，无言也舒服","Plain as water; comfortable even in silence",3]
["被同事孤立该主动示好吗","君子求诸己，小人求诸人","论语·卫灵公","君子找自己的原因，小人找别人的问题。被孤立不一定是你的问题，但提升自己永远没错。","Nobles seek within; the petty blame others. Exclusion isn't always your fault, but improving yourself is never wrong.","求诸己不赖人","Seek within; don't blame others",0],
["上班带饭觉得丢人","士志于道，而耻恶衣恶食者，未足与议也","论语·里仁","一个追求道的人，如果因吃得差穿得差而羞耻，不值得跟他讨论。带饭不丢人，丢人的是虚荣。","One seeking truth who's ashamed of simple food and clothes—not worth discussing with. Packing lunch isn't shameful; vanity is.","带饭是俭，丢人是虚荣","Packing lunch is frugal; shame is vanity",0],
["面试官问为什么频繁跳槽","人而无恒，不可以作巫医","论语·子路","没有恒心的人连巫医都做不了。每次跳槽背后的理由要是成长的，不是逃跑的。你自问每次是不是往上跳。","Without constancy, you can't even be a shaman. Each jump should be toward growth, not escape. Ask: was each one upward?","每跳是成长，不是逃跑","Each jump is growth, not escape",0],
["PPT做不好总被领导退回","工欲善其事，必先利其器","论语·卫灵公","想把事做好先磨好工具。花一个下午学排版配色，比你加班改十版有用。","To do good work, sharpen your tools first. Spend an afternoon learning design—better than ten redos at midnight.","先磨刀再砍柴","Sharpen the axe before chopping",0],
["同事把杂活都推给我做","君子可逝也，不可陷也；可欺也，不可罔也","论语·雍也","你可以去帮忙，但不能被坑。可以善意被利用一次，不能被当傻子一直使唤。第二次就要拒绝了。","You can go help, but can't be trapped. You can be deceived once out of kindness, but not endlessly. Refuse the second time.","可帮不可坑，第二次拒绝","Help, don't be trapped; refuse the second time",0],
["参加同学会发现大家都比我混得好","不患人之不己知，患不知人也","论语·学而","不怕别人不知道你，怕你不了解别人。混得好不好是给别人看的，活得好不好是自己知道的。","Don't worry others don't know you—worry you don't know yourself. Success is for show; fulfillment is known only to you.","别人知不知不重要，自知最重要","Others knowing you matters less than knowing yourself",0],
["带团队手下不服管","其身正，不令而行；其身不正，虽令不从","论语·子路","自己正，不下令大家也干；自己不正下了令也没人听。以身作则比下命令管用一万倍。","Be upright, they follow without orders. Be crooked, no order works. Leading by example is ten thousand times more effective.","正己令自行","Be upright; orders follow naturally",0],
["上班两年存款为零很羞愧","德者本也，财者末也","大学","德行是根本，钱财是末梢。两年零存款不羞耻，这两年你攒的能力和经验才是本金。","Virtue is root; wealth is branch. Zero savings in two years isn't shameful—the skills and experience you gained are your principal.","德是本，财是末","Virtue is root; wealth is branch",5],
["双十一又忍不住剁手了","少则得，多则惑","道德经·第二十二章","东西少了才真正拥有，多了反而迷惑。你买的不是需要，是空虚。","Less brings gain; more brings confusion. You're buying not needs, but emptiness.","少则得，多则惑","Less is gain; more is confusion",5],
["被忽悠办了美容卡后悔了","信言不美，美言不信","道德经·第八十一章","真话不好听，好听话不真实。美容院的甜言蜜语就是美言不信，吃一堑长一智。","True words aren't pretty; pretty words aren't true. Sweet talk at the salon was just that—learn and move on.","美言不信，吃一堑长一智","Pretty words lie; learn the lesson",5],
["想买基金但什么都不懂","知不知，尚矣；不知知，病也","道德经·第七十一章","知道自己不懂是高明，不懂装懂是病。买基金先恶补三个月知识再说。","Knowing your ignorance is wisdom; ignorant pretense is disease. Study for three months before buying any fund.","知不知是智，不懂装懂是病","Knowing ignorance is wisdom; faking knowledge is sickness",5],
["越来越不想发朋友圈了","知者不言，言者不知","道德经·第五十六章","智者不多言，多言者不智。减少朋友圈不是社交退缩，是你在从'表达者'变成'观察者'。","The wise don't talk much; talkers aren't wise. Posting less isn't withdrawal—you're evolving from expresser to observer.","不发是知，观察比表达深","Not posting is wisdom; observing is deeper than expressing",1],
["朋友结婚包红包不知道该包多少","礼，与其奢也，宁俭","论语·八佾","礼的本质不在奢，在诚。红包量力而行，别打肿脸充胖子。","Ritual prefers frugality over extravagance. Give within your means; don't puff yourself up.","礼宁俭，量力而行","Ritual prefers modesty; give what you can",1],
["被别人评价衣品差","士志于道，而耻恶衣恶食者，未足与议也","论语·里仁","穿得普通但内心充实，比穿得光鲜但脑子空洞强一万倍。外表是给别人看的，内涵是自己的。","Plain clothes with a full heart beat flashy clothes with an empty mind. Looks are for others; substance is yours.","衣恶不耻，心空才耻","Simple clothes aren't shameful; empty hearts are",1],
["被闺蜜抢了男朋友","不逆诈，不亿不信","论语·宪问","不要预设欺骗，但也不要回避真相。被抢走的本来就不属于你。感谢闺蜜帮你做了筛选。","Don't pre-assume deceit, but don't avoid truth. What's taken was never yours. Thank her for filtering for you.","不逆诈，被抢走的本来就不牢","Don't assume deceit; what's taken was never solid",1],
["想离婚又怕伤害孩子","成事不说，遂事不谏，既往不咎","论语·八佾","已成的事不必再说。孩子需要的是两个快乐的人，不是一个凑合的家。你的幸福才是给孩子最好的教育。","What's done, don't dwell on. Kids need two happy people, not one forced home. Your happiness is their best education.","孩子要快乐的你，不要凑合的家","Kids want happy you, not a patched home",3],
["婆婆总是干预我们的生活方式","事父母几谏，见志不从，又敬不违，劳而不怨","论语·里仁","对长辈可以委婉建议，她不听就继续恭敬、不违抗、继续操劳但不怨恨。不是忍气吞声，是设置温柔的边界。","Gently advise elders; if they don't listen, remain respectful and persistent but not resentful. Soft boundaries, not silent suffering.","几谏不从，敬而不怨","Advise gently; if unheard, respect without resentment",3],
["生了孩子后夫妻感情变淡","发而皆中节，谓之和","中庸","情绪发出来但恰到好处叫和。孩子来了你们成了战友——战友情也是一种感情。偶尔把孩子交给老人，两个人约个会。","Emotions expressed in measure is harmony. With a child, you've become comrades—and that's also love. Occasionally leave the baby with grandparents and date each other.","战友也是情人，偶尔约会","Comrades are lovers too; date occasionally",3],
["爸妈天天转发养生谣言给我","道听而涂说，德之弃也","论语·阳货","路上听到就传播，这是道德的抛弃。告诉爸妈：您转的我每条都认真看了，但有些不太准，我们一起看看靠谱的。","Hearsay spread carelessly abandons virtue. Tell them: I read everything you send, but some aren't accurate—let's check reliable sources together.","道听途说不可取,陪他们一起看","Hearsay abandoned virtue; watch together",3],
["想要二胎但老公不想","二人同心，其利断金","周易·系辞","两个人心齐能断金。二胎不是一个人能决定的，先同心地沟通，再说利。把'我'的愿望变成'我们'的计划。","Two hearts aligned can sever metal. A second child isn't one person's decision—align hearts first, then discuss. Turn 'my wish' into 'our plan.'","同心断金，从我到我们","Aligned hearts sever metal; from me to us",3],
["被朋友放鸽子三次还该信他吗","人而无信，不知其可也","论语·为政","三次失信说明他的承诺不值钱。不是不原谅，是保护好自己——下次他约你，先确认三遍。","Three broken promises mean his word is worthless. It's not about forgiveness—it's about protecting yourself. Next time, triple-confirm.","三次不立信，保护自己","Three times no trust; protect yourself",1],
["感觉自己像个工具人","君子不器","论语·为政","你不是一件器皿，不是被定义成单一功能的工具。你可以是杯子也可以是花瓶，甚至是一座山。","You're not a vessel—not defined by a single function. You can be a cup, a vase, or even a mountain.","你不器，别定义自己","You're not a vessel; don't define yourself",4],
["总觉得在浪费时间一事无成","无用之用，方为大用","庄子·人间世","庄子说无用才是大用。发呆不是浪费时间，是无用之用——在信息爆炸的时代，空白是最奢侈的生产力。","Zhuangzi says uselessness is great use. Zoning out isn't wasted time—in our information-saturated age, blank space is the ultimate productivity.","无用是大用，空白是生产力","Uselessness is great use; blank space is productivity",4],
["孩子问活着的意义是什么","未知生，焉知死","论语·先进","孔子说还没搞懂生，怎么知道死？告诉孩子：活着就是去找这个答案，而找的过程本身就是意义。","Confucius said: not understanding life, how can you know death? Tell them: living is the search for this answer, and the search itself is the meaning.","活着就是在找答案的过程","Living is the search for meaning",3],
["觉得健身太苦坚持不下去","天将降大任于是人也，必先苦其心志，劳其筋骨","孟子·告子","上天要给你大任，先让你的筋骨劳苦。每次举铁都是给你的大任在天平上加一个砝码。","Heaven gives great missions only after hardship. Every rep adds a weight to your scale of destiny.","苦筋骨是降大任","Hardship is heaven's mission",6],
["总觉得自己不够好看","西施病心而颦其里，其里之丑人见而美之","庄子·天运","西施皱眉是因为心口疼，丑女模仿反而更丑。美不是模仿别人，是做最好的自己。","Xi Shi frowned because her heart ached; the ugly woman imitated and looked worse. Beauty isn't imitation—it's your best self.","美是做自己，不是模仿","Beauty is being yourself, not imitating",2],
["被同事穿了小鞋想报复","或曰：以德报怨，何如？子曰：何以报德？以直报怨，以德报德。","论语·宪问","有人问以德报怨怎样，孔子说那用什么报德？用正直报怨，用恩德报德。报复拉低你的格局，正直让人尊重。","Some asked: repay resentment with kindness? Confucius: then how repay kindness? Repay resentment with fairness, kindness with kindness.","以直报怨，以德报德","Fairness for resentment; kindness for kindness",0],
["感觉一生将碌碌无为","君子疾没世而名不称焉","论语·卫灵公","君子怕死后名字不被称道。但名字不是别人给你刻的碑，是你走出来的路。今天的每步都在书写你的墓志铭。","The noble worry their name won't be remembered after death. But your name isn't etched by others—it's the road you walk. Every step today writes your epitaph.","每一步都是墓志铭","Every step is your epitaph",4],
["总是拿别人的错误惩罚自己","不迁怒，不贰过","论语·雍也","不把愤怒转嫁给别人，不犯第二次同样的错。别人犯了错惩罚你，你还在惩罚自己——这已经是贰过了。","Don't shift anger, don't repeat mistakes. Others' errors punish you, and you keep punishing yourself—that's already repeating the mistake.","不迁怒于己","Don't shift anger onto yourself",2],
["在网上跟人吵架越想越气","善战者不怒","道德经·第六十八章","善于战斗的人不轻易发怒。网上的嘴仗从来赢不了——你赢了也是输了时间。关掉页面就是赢了。","Good fighters don't anger easily. Online arguments are never won—even if you 'win,' you lose time. Closing the page is winning.","善战不怒，关掉就是赢","Good fighters aren't angry; closing is winning",2],
["面对选择无从下手","鱼，我所欲也；熊掌，亦我所欲也。二者不可得兼","孟子·告子","鱼和熊掌不能兼得。选择的痛苦不是因为没有好选项，是因为两个都想要。写下两个选项，划掉一个，你就知道答案了。","Can't have both fish and bear paw. The pain of choice isn't lack of options—it's wanting both. Write both down, cross one out—you'll know.","写下两选项，划掉就知道","Write two, cross one—you'll know",4],
["总失眠想太多脑子停不下来","吾尝终日不食，终夜不寝，以思，无益，不如学也","论语·卫灵公","孔子说整夜不睡地空想没有用，不如学习。想太多不如做一点儿——哪怕是抄一页书、洗个碗。","Confucius said: I once thought all night without sleep—useless. Better to learn. Overthinking loses to doing—even copying a page or washing dishes.","思无益不如学，做代替想","Thinking useless; learn instead—do, don't think",6],
["对新环境适应不了很焦虑","入太庙，每事问","论语·八佾","孔子进太庙每件事都问。不懂就开口，真诚的新人永远受欢迎。怕的不是不懂，是不懂装懂。","Confucius asked about everything upon entering the temple. Ask when you don't know—sincere newcomers are always welcome. Fear not ignorance, but fake knowledge.","每事问，真诚是通行证","Ask everything; sincerity is your pass",0],
["老婆总嫌我赚得少","贫而无怨难，富而无骄易","论语·宪问","贫穷而不抱怨很难，富有而不骄傲容易。告诉她：我在努力，而且穷的时候不抱怨，富了也不会骄傲——这样的人请珍惜。","It's hard to be poor without complaint, easy to be rich without pride. Tell her: I'm working hard, and someone poor without complaint and rich without pride—value that.","贫而无怨难，请珍惜","Poor without complaint is hard; value it",3],
["工作中能力不被认可","不患莫己知，求为可知也","论语·里仁","不怕没人知道自己，只求有值得被知道的实力。持续输出，是金子迟早会被挖出来。","Don't worry no one knows you—worry you're not worth knowing. Keep outputting; gold will eventually be mined.","不患不己知，求可知","Don't worry about unknown; strive to be worth knowing",0],
["退休后跟社会脱节了","老骥伏枥，志在千里；烈士暮年，壮心不已","龟虽寿·曹操","老马站在槽边，心想着千里之外。烈士老了雄心还在。退休是新赛道的起点，开个公众号、学个乐器、走遍中国。","The old steed at the trough dreams of a thousand miles. Retirement is the start of a new track—start a blog, learn music, travel China.","老骥志千里，退休是起点","Old steed dreams far; retirement is the starting line",4],
["总是无意识地暴饮暴食","五味令人口爽","道德经·第十二章","过多的味道让味觉失灵。暴饮暴食不是饿了，是心里有洞想填。去找那个洞在哪，别用食物填。","Too many flavors dull the palate. Binge eating isn't hunger—it's a hole in your heart trying to fill. Find the hole; don't fill it with food.","心里有洞，别用食物填","A hole in the heart; don't fill it with food",6],
["父母越来越像小孩怎么应对","老吾老以及人之老","孟子·梁惠王","自己老了也这样。他们变小了，你变大了——小时候他们牵你，现在你牵他们。耐心是一种轮回。","You'll age like this too. They've grown small; you've grown big. They held your hand; now you hold theirs. Patience is a cycle.","轮回的耐心，你牵他们","Cyclic patience; now you hold them",3],
["想学的东西太多时间不够用","吾生也有涯，而知也无涯。以有涯随无涯，殆已","庄子·养生主","生命有限，知识无限。用有限的追无限的，很危险。今年只学三样，学透再换。","Life is limited; knowledge infinite. Chasing the infinite with the finite is dangerous. Choose three things this year; master before switching.","有涯追无涯殆矣，少而精","Finite chasing infinite is perilous; few but deep",4],
["总是忍不住跟风买网红产品","不贵难得之货，使民不为盗","道德经·第三章","不追捧稀罕的东西，就不会有人去偷。网红产品就是难得之货——你不追捧它，它就是个普通商品。","Don't prize rare goods, and people won't steal. Viral products are just 'rare goods'—stop prizing them, and they're just ordinary items.","不贵难得之货，网红是平凡物","Don't prize rare goods; viral is ordinary",5],
["被人说胖心里不舒服","君子不重则不威","论语·学而","这个'重'不是体重，是厚重、稳重。胖不胖不决定你的威严，你对自己的态度决定一切。","This 'weight' isn't body mass—it's gravitas. Your size doesn't determine your authority; your attitude toward yourself does.","重不在体，在态","Weight is in attitude, not body",6],
["牙齿坏了不敢去看牙医","小不忍则乱大谋","论语·卫灵公","不忍一时的牙疼去看医生，就会乱了一颗牙变成一口牙的大谋。今天预约，明天就好。","Not enduring momentary pain to see the dentist ruins the big plan—one bad tooth becomes a mouthful. Book today; fix tomorrow.","小不忍乱大谋，看牙要早","Small impatience ruins big plans; see the dentist early",6],
["被降职了觉得没脸见人","穷则独善其身，达则兼济天下","孟子·尽心","不得志时修养好自己，得志时再帮助天下。降职不是终点，是你修养自己的最佳时机。","In hardship, cultivate yourself. Demotion isn't the end—it's your best window for self-cultivation.","穷则独善，降职是修身","In difficulty, better yourself; demotion is cultivation",0],
["同事总迟到让我替他干活","躬自厚而薄责于人，则远怨矣","论语·卫灵公","多责备自己，少责备别人，就能远离怨恨。他迟到是他薄，你替他干是你厚。厚一次是人情，厚十次是愚蠢。","Blame yourself more, others less—and stay free of resentment. His tardiness is his thinness; covering once is grace, covering ten times is folly.","厚一次是人情，十次是愚蠢","Once is grace; ten times is folly",0],
["对未来感到极度迷茫","知止而后有定，定而后能静，静而后能安","大学","知道停在哪里才能坚定，坚定才能静下来，静下来才能安心。你现在需要的不是答案，是先停下来。","Knowing where to stop gives stability; stability gives calm; calm gives peace. What you need now isn't answers—it's to stop first.","先停下来，静下来才能安","Stop first; calm brings peace",2],
["人到中年想转行又不敢","朝闻道，夕死可矣","论语·里仁","早上明白了道，晚上死去也值。转行不是求道，但如果你早上醒来觉得新方向就是你的道——去吧，晚上不后悔。","Hear the truth at dawn, die at dusk content. Switching isn't the truth—but if you wake feeling the new path is your truth—go. No regrets at dusk.","朝闻道，不悔晚","Hear the way at dawn; no regrets at dusk",0],
["被人嘲笑口音很重","君子敬而无失，与人恭而有礼，四海之内，皆兄弟也","论语·颜渊","君子认真不出错，对人恭敬有礼，天下人都是兄弟。口音是你的根，不是你的错。嘲笑你口音的人才失了礼。","The noble are respectful and faultless; courteous to all—under heaven, all are brothers. Your accent is your root, not your fault. Those mocking you have lost courtesy.","口音是根，嘲笑才失礼","Accent is root; mockery is rudeness",1],
["在网上被人肉搜索威胁了","非礼勿视，非礼勿听，非礼勿言，非礼勿动","论语·颜渊","不看那些恶意的内容，不传谣，不回骂，不理会。保存证据、报警、拉黑——这是孔子说的'礼'在现代的延伸。","Don't look at malice, don't spread, don't respond, don't engage. Save evidence, report, block—this is Confucius's 'propriety' for the digital age.","非礼不动，保存证据拉黑","Improper? Don't engage; save evidence and block",1],
["小组作业队友摆烂","道不同，不相为谋","论语·卫灵公","你们的'道'不同——你要成绩他要混。下次组队前先看对方的道。这次就当练了自己的抗压能力。","Your paths differ—you want grades, they want coasting. Next time, screen teammates' paths first. This time, count it as resilience training.","道不同不相为谋，下次看准","Different paths don't walk together; next time screen carefully",0],
["总是给别人做嫁衣","曲则全，枉则直","道德经·第二十二章","委屈反而能保全，弯曲反而能伸直。给别人做嫁衣不亏——你做衣服的手艺谁也拿不走。","Bending preserves; curving straightens. Making wedding dresses for others isn't a loss—the dressmaking skill is yours forever.","手艺是自己的，谁也拿不走","The craft is yours; none can take it",0],
["年龄增长害怕被职场淘汰","物壮则老，是谓不道，不道早已","道德经·第三十章","太壮了就会衰老，不合道就会早亡。想要不淘汰，不是回到年轻，是让自己进化——学会AI、跨界、做年轻人不做的。","Over-strong leads to aging; not following the Way leads to early end. To stay relevant, don't chase youth—evolve. Learn AI, cross boundaries, do what youth won't.","不道早已，进化不淘汰","Not following the Way ends early; evolve to stay",0],
["亲戚总问我一个月赚多少钱","富与贵，是人之所欲也，不以其道得之，不处也","论语·里仁","富贵是人都想要的，但不以正道得来就不要。工资是私事，不以正确方式问的可以不答。笑着说'够花'。","Wealth and status are desired by all—but if not gained rightly, refuse them. Salary is private; questions asked improperly need no answer. Smile and say 'enough.'","不以其道问，可以笑而不答","Improperly asked; smile without answering",1],
["被人说自己不合群很孤立","鸟兽不可与同群，吾非斯人之徒与而谁与","论语·微子","不能和鸟兽同群，我不跟人在一起跟谁在一起。但不合群不等于没朋友——你是跟对的人合群。","Can't flock with birds and beasts—I'm with humans. But being 'unsociable' doesn't mean friendless—you're just selective about your flock.","跟对的人合群","Flock with the right ones",1],
["看到别人都很努力自己很慌","学如不及，犹恐失之","论语·泰伯","学习像在追什么东西，追上了还怕丢掉。但不是所有人都要跑你的赛道。你按自己的速度来。","Learning feels like chasing—catch up and fear losing it. But not everyone runs your track. Go at your own pace.","别人的赛道不关你事","Others' tracks aren't your concern",4],
["家里老人病了我在外地心急如焚","父母在，不远游，游必有方","论语·里仁","游必有方——这个'方'现在就是你的方向：安排好远程医疗、托付亲友、每天视频，你不在身边但心在。","Wandering must have a direction—now your direction is: arrange remote care, trust relatives, video call daily. You're not there, but your heart is.","游必有方，心在即是在","Wandering has a direction; your heart being there is being there",3],
["感觉自己总是讨好型人格","巧言令色，鲜矣仁","论语·学而","花言巧语、装出和颜悦色的人很少有仁德。讨好不是善良，是另一种控制。真正的仁是真诚地站在那。","Sweet words and pleasing faces rarely hold virtue. People-pleasing isn't kindness—it's another form of control. True benevolence stands there sincerely.","讨好不是仁，真诚才是","Pleasing isn't benevolence; sincerity is",1],
["面对职场霸凌不知如何是好","勇者不惧","论语·子罕","勇敢的人不恐惧。霸凌的本质是找软柿子捏。你硬一次——冷静但坚定地说不——对方反而会退。","The brave don't fear. Bullying targets soft persimmons. Stand firm once—say no calmly but firmly—and they'll retreat.","勇者不惧，硬一次","The brave don't fear; stand firm once",0],
["当了全职妈妈没有价值感","君子素其位而行，不愿乎其外","中庸","君子在什么位置就做什么事，不羡慕位置之外的东西。你现在的岗位是世界上最重要的——培养一个人。","The noble act according to their position, not envying beyond it. Your current role is the world's most important—raising a human being.","在其位行其事，培养一个人","In your position, do your work—raising a human being",3],
["被公司优化后半年找不到工作","天之道，损有余而补不足","道德经·第七十七章","天之道是减多余的来补不足的。你现在的不足，是在为之前透支的自己补课。这段时间是你给灵魂放的假。","Heaven's way is subtracting the excess to supplement the deficient. Your current deficit is repaying your previous overdraft. This time is a vacation for your soul.","损有余补不足，放假给灵魂","Subtract excess, supplement deficit; vacation for the soul",0],
["总是梦到过去的事醒来难受","成事不说，遂事不谏，既往不咎","论语·八佾","已成的事不说了，过去了不追究。梦是潜意识在整理记忆，醒来就放下，那是大脑在打扫卫生。","What's done, don't discuss; what's passed, don't dwell on. Dreams are the subconscious sorting memories—waking, let them go. It's your brain cleaning house.","梦是大脑打扫，醒来放下","Dreams are the brain cleaning; let go upon waking",2],
["总想攒钱但物价越来越高","富而可求也，虽执鞭之士，吾亦为之","论语·述而","富贵如果值得追求，就算做赶车人也行。贬值是宏观的，攒钱是微观的——你控制不了物价，但可以控制今天的每一块钱。","If wealth were worth chasing, I'd be a driver. Inflation is macro; saving is micro—you can't control prices, but you can control every dollar today.","控不了物价，控得了自己","Can't control prices; can control yourself",5],
["感觉人与人之间的关系越来越冷漠","君子敬而无失，与人恭而有礼，四海之内，皆兄弟也","论语·颜渊","君子认真无过失，对人恭敬有礼，天下人都是兄弟。冷漠的时代更需要你主动递出第一份温暖。","The noble, faultless and courteous, finds brothers everywhere. In a cold era, your initiative to offer warmth is needed most.","你递温暖，世界回你阳光","Offer warmth; the world returns sunshine",1],
["想学新东西但怕被人笑","敏而好学，不耻下问","论语·公冶长","聪明又爱学，不耻于向不如自己的人请教。学新东西不怕被笑——笑你的人十年后可能还得跟你学。","Quick and eager to learn, not ashamed to ask those beneath you. Don't fear mockery for learning new things—those laughing may need to learn from you in ten years.","不耻下问，十年后他们问你","Not ashamed to ask; in ten years they'll ask you",4],
["觉得自己抑郁症了但家人不理解","人不知而不愠，不亦君子乎","论语·学而","别人不理解你，你不生气——这就是君子。家人不理解抑郁是因为他们没经历过。带他们一起去看医生，让医生说。","Not angered when misunderstood—that's nobility. Family doesn't understand depression because they haven't lived it. Take them to the doctor; let the doctor explain.","不愠是君子，带他们去看医生","Not angered is noble; take them to the doctor",2],
["看到朋友圈好友都结婚了","君子和而不同","论语·子路","君子能和而不同——别人的人生步伐跟你不同，你不需要追赶。结婚是'和'，单身的'不同'也是正常的。","Nobles harmonize without conforming. Others' life pace differs from yours—you don't need to catch up. Marriage is 'harmony'; single 'difference' is also normal.","和而不同，节奏自己定","Harmonize without conforming; your pace, your choice",2],
["感觉和周围人格格不入","君子和而不同，小人同而不和","论语·子路","君子和谐但不完全相同，小人表面一致但内心不合。格格不入说明你有独立人格，不是你的问题。","Nobles harmonize without sameness; the petty conform without harmony. Not fitting in means you have independent character—that's not a flaw.","格格不入是独立人格","Not fitting in is independent character",2],
["做的项目被别人否决了","多见阙殆，慎行其余，则寡悔","论语·为政","多看危险的地方，小心做其余的事，就能减少后悔。项目被否不是失败，是多见了一次'殆'。下次就少了这一个坑。","See the dangers; act carefully on the rest—less regret. Project rejection isn't failure; you've just identified one more pitfall for next time.","被否是见殆，下次少一坑","Rejection is seeing danger; one less pit next time",0],
["父母不支持我的梦想","事父母几谏，见志不从，又敬不违，劳而不怨","论语·里仁","对父母反复建议，他们不听就继续恭敬、不违抗地执行，但不怨恨。你执行你的梦想，同时保持恭敬——这就是几谏。","Advise parents repeatedly; if unheard, remain respectful and persistent without resentment. Pursue your dream while staying respectful—that's gentle persuasion.","几谏不怨，做你的梦，敬你的人","Advise without resentment; dream your dream, respect your people",3],
["总是在想如果能重来该多好","来者犹可追","论语·微子","过去追不回，未来还可以追。如果重来一百次你还是会走这条路——因为那是当时的你做的当时最好的选择。","The past is gone; the future can be pursued. If you could redo it a hundred times, you'd still choose this path—because that was the best choice by the you of that time.","来者可追，过去的你就是最好的你","The future is catchable; past you made the best choice",2],

  1:{zh:{quote:[['卡耐基','一个人的成功，15%靠专业知识，85%靠人际沟通。不会说话不是缺陷，不练才是。'],['马歇尔·卢森堡','不带评论的观察是人类智力的最高形式。说"你总是迟到"是评判，说"这周你迟到了三次"是观察——后者才通向改变。']],

  en:{quote:[['Dale Carnegie','Success is 15% professional knowledge and 85% human communication. Not being eloquent is no flaw—not practicing is.'],['Marshall Rosenberg','Observation without evaluation is the highest form of human intelligence. "You are always late" judges; "You were late three times this week" observes—the latter opens the door to change.']],

  book:['《活出生命的意义》维克多·弗兰克尔 —— 集中营里他发现的真相：人可以被夺走一切，除了最后一种自由——选择以何种态度面对境遇的自由。情绪低谷时记住：你永远拥有"态度"这个选项。']},
  en:{quote:[['Viktor Frankl','Between stimulus and response there is a space. In that space lies our freedom and our power. No circumstance can take away your freedom to choose your response.'],['Arthur Schopenhauer','Life swings like a pendulum between pain and boredom. Anxiety is not dangerous—what is dangerous is mistaking it for failure. It is just the noise of a signal.']],
  book:['Mans Search for Meaning, Viktor Frankl — What he discovered in the concentration camp: everything can be taken from a person except one final freedom—the freedom to choose one attitude toward any circumstance. In the valleys of emotion, remember: you always hold the "attitude" option.']}},
  3:{zh:{quote:[['约翰·戈特曼','幸福婚姻的秘诀不是解决所有冲突，而是修复冲突。每1次伤害，需要5次善意来修复。'],['武志红','家庭是最大的道场。你在家里处理不好关系，是因为你一直在重复童年的剧本——觉察剧本，才能改写剧本。']],
  book:['《亲密关系》罗兰·米勒 —— 伴侣关系研究的结论：长期幸福的夫妻不是不吵架，而是吵架后修复得更好。关系不是找到对的人，是把自己变成对的人。']},
  en:{quote:[['John Gottman','The secret of a happy marriage is not solving all conflicts but repairing them. Every 1 wound needs 5 acts of kindness to heal.'],['Wu Zhihong','Family is the greatest training ground. If you cannot handle family relationships, it is because you keep repeating your childhood script—notice the script before you can rewrite it.']],
  book:['Intimate Relationships, Rowland Miller — Research conclusion: long-term happy couples are not those who never fight, but those who repair better after fighting. A relationship is not about finding the right person; it is about becoming the right person.']}},
  4:{zh:{quote:[['纳瓦尔','在成为自己的这条路上，没有什么可以失去，只有收获。你唯一要战胜的，是昨天的自己。'],['卡罗尔·德韦克','失败的信息不是"我不行"，而是"我还没学会"。把"我不擅长"改成"我还没擅长"——一个字的距离，两种人生。']],
  book:['《终身成长》卡罗尔·德韦克 —— 固定型思维者怕失败，成长型思维者爱挑战。差别不在天赋，在于你如何解释失败。把每次挫折读作"反馈"而不是"判决"，成长就开始了。']},
  en:{quote:[['Naval Ravikant','On the path to becoming yourself, there is nothing to lose and everything to gain. The only person you need to beat is yesterday\'s you.'],['Carol Dweck','The message of failure is not "I cannot" but "I have not learned yet." Change "I am not good at this" to "I am not good at this yet"—one word, two different lives.']],
  book:['Mindset, Carol Dweck — Fixed mindset people fear failure; growth mindset people embrace challenges. The difference is not talent but how you interpret failure. Read every setback as "feedback" instead of "verdict," and growth begins.']}},
  5:{zh:{quote:[['巴菲特','别人贪婪我恐惧，别人恐惧我贪婪。真正的风险不是波动，是你不知道自己买的是什么。'],['查理·芒格','我这辈子见过的聪明人，没有一个不是每天读书的。你们的问题，都在书里有过答案。']],
  book:['《穷查理宝典》查理·芒格 —— 多元思维模型：别用一把锤子看所有问题。理财的本质不是追涨杀跌，是建立"反过来想"的思考习惯：想致富，先研究人是怎么变穷的。']},
  en:{quote:[['Warren Buffett','Be fearful when others are greedy, and greedy when others are fearful. Real risk is not volatility—it is not knowing what you are buying.'],['Charlie Munger','I have never met a smart person in my life who does not read every day. All your questions have answers in books.']],
  book:['Poor Charlie\'s Almanack, Charlie Munger — Mental models from many disciplines: do not treat every problem like a nail because you only hold a hammer. The essence of finance is not chasing highs and cutting lows; it is the habit of "inverting"—to get rich, first study how people get poor.']}},
  6:{zh:{quote:[['约翰·瑞迪','运动是改善情绪最可靠、最廉价、最没有副作用的药物。运动时大脑分泌的多巴胺，比任何药物都诚实。'],['医学界共识','睡眠是最好的修复，运动是最好的抗抑郁药，饮食是最好的体检报告。身体不会说谎。']],
  book:['《运动改造大脑》约翰·瑞迪 —— 科学结论：运动不仅塑造肌肉，还重塑大脑。规律运动对抑郁的改善效果，不亚于药物，且没有副作用。情绪差的时候，先动起来，再谈其他。']},
  en:{quote:[['John Ratey','Exercise is the most reliable, cheapest, and most side-effect-free medicine for improving mood. The dopamine your brain releases during exercise is more honest than any pill.'],['Medical consensus','Sleep is the best repair, exercise the best antidepressant, diet the best health report. The body does not lie.']],
  book:['Spark: The Revolutionary New Science of Exercise and the Brain, John Ratey — Scientific finding: exercise builds not only muscle but also brain. Regular exercise rivals antidepressants in treating depression, without side effects. When your mood is low, move first—then talk about the rest.']}}

// 按分类定制多维解读 + 行动建议
const ADVICE={
  0:{zh:{ang:['💼 工作层面：问题的根源往往不在事情本身，而在你和这份工作的关系。退一步看，是技能不匹配、价值不认可，还是节奏不合拍？明确卡点，你才有解药。','🧠 心理层面：职场消耗你的，从来不是工作量，而是不确定感。把模糊的焦虑变成清单上的具体条目，每划掉一项，信心就回来一分。','🔑 关键一步：与其纠结"要不要继续忍"，不如问自己"我在这里还能学到什么"。只要答案不是"没有"，这里就还是你的学堂。'],
  act:['写下一份"我的职场资产负债表"：这段经历给了你什么能力、人脉、资源？离开前先算清资产。','选一件你能控制的小事做到极致（哪怕只是把周报写漂亮），找回掌控感。','设定一个明确的"观察期"（如3个月），到期再决定去留，避免情绪化决策。']},
  en:{ang:['Work level: the issue is rarely the task itself—it is your relationship to the work. Is it a skill mismatch, unrecognized value, or a rhythm problem? Name the blocker, find the cure.','Mind level: what drains you at work is uncertainty, not workload. Turn vague anxiety into concrete checklist items—each one crossed off restores confidence.','Key step: instead of asking "should I endure," ask "what can I still learn here?" As long as the answer isn\'t "nothing," this place is still your school.'],
  act:['Write a "career balance sheet": what skills, connections, and resources has this experience given you? Count assets before you leave.','Pick one small thing you fully control and do it excellently—regain your sense of agency.','Set a clear "observation period" (e.g., 3 months), then decide—avoid emotional decisions.']}},
  1:{zh:{ang:['🤝 关系层面：人际的痛，大多源于"期待错位"。你给了十分，却期待对方按你的剧本回应。先把期待说出来，而不是藏在心里等对方猜。','🧠 心理层面：被拒绝、被冷落的瞬间，容易触发"我不够好"的自我怀疑。记住：别人的态度是一面镜子，照出的是他，不是你。','🔑 关键一步：边界不是墙，是门。学会温和而坚定地说"不"，关系反而更健康——清晰的人最被尊重。'],
  act:['今晚想一件"你一直忍着没说"的事，用"我觉得…我希望…"的句式温和表达出来。','给一段消耗你的关系画个圈：圈外是别人，圈内是你自己，守住圈内的平静。','主动发起一次真诚的邀约或倾听，你播的善意会回来。']},
  en:{ang:['Relationship level: most interpersonal pain comes from mismatched expectations. You gave ten, but expect them to follow your script. Speak your expectations instead of hiding them.','Mind level: rejection instantly triggers "I am not good enough." Remember: their attitude is a mirror that shows them, not you.','Key step: boundaries are not walls—they are doors. Learn to say "no" gently but firmly; relationships grow healthier. Clear people are the most respected.'],
  act:['Tonight, express one thing you have been holding in, using "I feel... I hope..." language.','Draw a circle around a draining relationship: outside is them, inside is you. Guard the calm within.','Initiate one sincere invitation or listening session—your kindness will return.']}},
  2:{zh:{ang:['🌊 情绪层面：情绪不是敌人，是信使。焦虑在提醒你准备，悲伤在提醒你珍惜。先接纳它，才能听懂它要说什么。','🧠 心理层面：想不通的根源是"反刍"——反复咀嚼同一件事。大脑需要出口：写下来、说出来、动起来，任何一个都有效。','🔑 关键一步：情绪风暴中，先处理心情，再处理事情。深呼吸三次，等风暴过去，你会看见更清楚的路。'],
  act:['找一个本子，把脑子里转个不停的想法全部倒出来，不评判、不停顿，写满一页。','给自己设一个"情绪休息站"：每天10分钟，只听音乐或散步，不刷手机。','把"我为什么这么难受"改成"我现在需要什么"——后者指向行动，前者只会打转。']},
  en:{ang:['Emotion level: emotions are not enemies—they are messengers. Anxiety prepares you; sadness reminds you to cherish. Accept it first to hear what it says.','Mind level: what keeps you stuck is rumination—chewing the same thought. The mind needs an exit: write it, say it, move it. Any one works.','Key step: in a storm of emotion, fix the mood first, then the matter. Three deep breaths; when the storm passes, the road becomes clear.'],
  act:['Take a notebook and pour out every circling thought—no judging, no stopping, until the page is full.','Set up a "mood rest stop": 10 minutes daily of music or walking, no phone.','Change "why do I feel so bad" into "what do I need right now"—the latter points to action.']}},
  3:{zh:{ang:['🏠 家庭层面：家人的话常常是爱的笨拙表达。他们催你、管你、比较你，背后是怕你走弯路——先听懂那层担心。','🧠 心理层面：家庭关系里最难的是"课题分离"：他们的人生期待是他们的课题，你的人生选择是你的课题。分清边界，才能温柔。','🔑 关键一步：改变家人很难，改变相处方式很容易。多打一个电话、多说一句"我挺好的"，关系会自己松动。'],
  act:['本周主动联系一次家人，不问对错，只聊聊日常——关系的裂缝都是从日常修复的。','把"他们不理解我"换成"他们用了不懂我的方式爱我"，你的怨气会消一半。','在家庭矛盾中，先保情绪、再谈道理：等双方都平静了，沟通才有效。']},
  en:{ang:['Family level: family words are often clumsy expressions of love. Their pushing, controlling, and comparing hides fear of you taking a wrong path—hear the worry beneath.','Mind level: the hardest thing in family is separation of concerns. Their expectations are their lesson; your choices are yours. Clear the boundary to be gentle.','Key step: changing family is hard; changing how you interact is easy. One more call, one more "I am fine"—the relationship loosens by itself.'],
  act:['Reach out to family this week—no right or wrong, just daily talk. Cracks heal through dailyness.','Replace "they don\'t understand me" with "they loved me in a way that couldn\'t reach me"—half the resentment dissolves.','In family conflict, protect the emotion before the logic: communicate only when both are calm.']}},
  4:{zh:{ang:['🌱 成长层面：所有的"做不到"都只是"还没到"。拖延、半途而废、三分钟热度，都是因为目标太大、反馈太慢。把目标切小，把反馈调快。','🧠 心理层面：你不是懒，是怕——怕做了还是不够好，怕努力了还是输。允许自己先"做得很烂"，烂着烂着就好了。','🔑 关键一步：别等状态好了再开始，是开始了状态才会好。哪怕只做5分钟，也算破冰。'],
  act:['把"我要学X"改成"今天学X的5分钟"——小到不可能失败，就容易开始。','设一个"烂开始"仪式：每天固定时间、固定地点做5分钟，不管质量。','完成一个小目标后立刻奖励自己，让大脑把"努力"和"快乐"连上线。']},
  en:{ang:['Growth level: every "I cannot" is just "not yet." Procrastination, quitting, and three-day passion come from goals too big and feedback too slow. Shrink the goal, speed the feedback.','Mind level: you are not lazy—you are afraid. Afraid of not being good enough, of trying and losing. Allow yourself to start badly; bad becomes better with practice.','Key step: do not wait for good mood to start—starting creates the mood. Even 5 minutes breaks the ice.'],
  act:['Change "I want to learn X" to "learn X for 5 minutes today"—so small it cannot fail, so easy to start.','Set a "messy start" ritual: 5 minutes at a fixed time and place, quality irrelevant.','Reward yourself immediately after a small win—connect "effort" with "pleasure" in your brain.']}},
  5:{zh:{ang:['💰 金钱层面：花钱的快乐是即时满足，攒钱的快乐是延迟满足。前者让钱包变轻，后者让底气变重。先分清"需要"和"想要"。','🧠 心理层面：冲动消费买的往往不是东西，是情绪——空虚、焦虑、被比较。购物车是最好的情绪诊断书。','🔑 关键一步：给自己设一道"冷静门槛"：想买的东西先放购物车3天，3天后还想买再说。多数冲动会自己蒸发。'],
  act:['做一次"消费复盘"：翻出上月账单，标出哪些是"想要"，下次先砍掉它们。','开启"一进一出"原则：买一件新的，先处理一件旧的。','把工资到账日设为"冷静日"：当天不购物，先记账。']},
  en:{ang:['Money level: spending buys instant satisfaction; saving buys delayed fulfillment. The first lightens your wallet, the second strengthens your backbone. Distinguish "need" from "want" first.','Mind level: impulse purchases buy emotions, not goods—emptiness, anxiety, comparison. Your shopping cart is a diagnosis of your mood.','Key step: set a "cooling threshold": anything you want goes into the cart for 3 days. If you still want it after, buy it. Most impulses evaporate.'],
  act:['Do a "spending review": look at last month\'s bills, mark what was "want," cut those next time.','Adopt "one in, one out": for each new item, dispose of an old one.','Make payday a "calm day": no shopping, just accounting.']}},
  6:{zh:{ang:['🫀 身体层面：身体是最诚实的员工，你熬夜、久坐、暴食，它都会记账。现在的疼痛是它在向你请假——先别硬扛。','🧠 心理层面：很多身体不适是心理压力的出口。焦虑紧张久了，肌肉、肠胃、睡眠都会抗议。调理身体，也要调理心情。','🔑 关键一步：别追求"立刻变健康"，追求"今天比昨天好一点"：多喝一杯水、早睡半小时、走两千步，都是赢。'],
  act:['从今晚开始，把手机放在离床两米远的地方充电——这是改善睡眠最便宜的一步。','每天设两个"微活动"闹钟：上午下午各一次，站起来伸展2分钟。','记一周"身体日记"：每天一行，睡了几小时、走了多少步、心情几分。看见，才会改变。']},
  en:{ang:['Body level: the body is your most honest employee. Stay up late, sit long, binge—it keeps the books. Current pain is it asking for leave. Do not just tough it out.','Mind level: many physical complaints are outlets for mental pressure. Prolonged anxiety shows up in muscles, digestion, and sleep. Care for the body means caring for the mood.','Key step: do not chase "instantly healthy"; chase "better than yesterday": one more glass of water, thirty minutes earlier to bed, two thousand more steps—all wins.'],
  act:['Tonight, charge your phone two meters from the bed—the cheapest fix for better sleep.','Set two "micro-move" alarms daily: stand and stretch for 2 minutes each.','Keep a week-long "body diary": one line daily—hours slept, steps walked, mood score. Seeing leads to changing.']}}

function buildAdvice(q,l){
  const a=ADVICE[q[7]]||ADVICE[2];
  const d=l==='zh'?a.zh:a.en;
  const t=l==='zh'?'🔍 多维解读':'Multi-angle reading';
  const s=l==='zh'?'✅ 给你三条行动建议':'Three steps to try';
  let h=`<div style="margin-top:14px;border-top:1px solid var(--bdr);padding-top:10px">`;
  h+=`<div style="font-size:13px;color:var(--gold);letter-spacing:2px;margin-bottom:6px">${t}</div>`;
  h+=d.ang.map(x=>`<div style="font-size:13px;line-height:1.9;margin:5px 0;padding:8px 10px;background:var(--inp);border-left:2px solid var(--accent)">${x}</div>`).join('');
  h+=`<div style="font-size:13px;color:var(--gold);letter-spacing:2px;margin:12px 0 6px">${s}</div>`;
  h+=d.act.map((x,i)=>`<div style="font-size:13px;line-height:1.9;margin:5px 0;padding:8px 10px;background:var(--card);border:1px solid var(--bdr)">${i+1}. ${x}</div>`).join('');
  h+=`</div>`;
  return h;
}

function backToMain(){
  document.getElementById('mainPage').style.display='block';
  document.getElementById('detailPage').style.display='none';
  if(searchTerm||catFilter>=0)doSearch();else doSearch();
}

// ========== FAVORITES ==========
function toggleFav(){
  if(curIdx<0)return;
  const i=favorites.indexOf(curIdx);
  if(i>=0){favorites.splice(i,1);showT(lang==='zh'?'已取消收藏':'Removed from favs');}
  else{favorites.push(curIdx);showT(lang==='zh'?'已收藏 ★':'Favorited ★');}
  saveFav();renderDetail(curIdx);
}

function quickFav(idx){
  const i=favorites.indexOf(idx);
  if(i>=0)favorites.splice(i,1);else favorites.push(idx);
  saveFav();doSearch();
}

function showFavorites(){
  if(favorites.length===0){showT(lang==='zh'?'收藏夹是空的':'No favorites yet');return;}
  catFilter=-1;
  document.getElementById('searchBox').value='';
  document.getElementById('favCount').textContent=favorites.length;
  const l=lang,favSet=new Set(favorites);
  const div=document.getElementById('resultList');
  const list=favorites.map(i=>Q[i]).filter(Boolean);
  div.innerHTML=list.map(q=>`
    <div class="result-card" onclick="viewDetail(${Q.indexOf(q)})">
      <div class="dilemma">${q[0]}</div>
      <div class="meta">${q[2]} · ${(lang==='zh'?CATS:CATS_EN)[q[7]]} <span class="fav-star active">★</span></div>
    </div>
  `).join('');
  document.getElementById('mainPage').style.display='block';
  document.getElementById('detailPage').style.display='none';
  renderCatBar();
}

// ========== RANDOM ==========
function randomOne(){
  const list=catFilter>=0?Q.filter(q=>q[7]===catFilter):Q;
  const idx=Q.indexOf(list[Math.floor(Math.random()*list.length)]);
  viewDetail(idx);
}

// ========== COPY ==========
function copyCard(){
  if(curIdx<0)return;
  const q=Q[curIdx];
  const text=`【${q[0]}】\n古人言：${q[1]}（${q[2]}）\n今解：${q[3]}\nEnglish: ${q[4]}\n今日心法：${q[5]}\n——与古为徒 · YuguTether`;
  navigator.clipboard.writeText(text).then(()=>showT(lang==='zh'?'已复制':'Copied')).catch(()=>showT(lang==='zh'?'复制失败':'Copy failed'));
}

// ========== DOWNLOAD CARD (PNG) ==========
function downloadCard(){
  if(curIdx<0)return;
  const q=Q[curIdx];
  const l=lang;
  const W=600,H=840;
  const cv=document.getElementById('cv');
  cv.width=W;cv.height=H;
  const c=cv.getContext('2d');
  // 背景
  const grad=c.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#0d0d1a');grad.addColorStop(1,'#13132b');
  c.fillStyle=grad;c.fillRect(0,0,W,H);
  // 网格
  c.strokeStyle='rgba(30,55,153,0.15)';c.lineWidth=1;
  for(let x=0;x<W;x+=30){c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke();}
  for(let y=0;y<H;y+=30){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke();}
  // 边框
  c.strokeStyle='#4a69bd';c.lineWidth=3;c.strokeRect(10,10,W-20,H-20);
  c.strokeStyle='rgba(74,105,189,0.4)';c.lineWidth=1;c.strokeRect(20,20,W-40,H-40);
  // 标题
  c.fillStyle='#ffd700';
  c.font='bold 28px "Microsoft YaHei","PingFang SC",sans-serif';
  c.textAlign='center';
  c.fillText('与 古 为 徒 · YuguTether',W/2,60);
  c.font='14px "Microsoft YaHei",sans-serif';
  c.fillStyle='#7f8fa6';
  c.fillText('At the crossroads, ask the ancients',W/2,88);
  // 分隔线
  c.strokeStyle='rgba(255,215,0,0.4)';c.lineWidth=1;
  c.beginPath();c.moveTo(60,105);c.lineTo(W-60,105);c.stroke();
  // 困境
  c.fillStyle='#c8d6e5';
  c.font='13px "Microsoft YaHei",sans-serif';
  c.textAlign='left';
  c.fillText('困 境  ·  DILEMMA',60,135);
  c.font='bold 22px "Microsoft YaHei",sans-serif';
  c.fillStyle='#ffd700';
  wrapText(c,q[0],60,165,W-120,30);
  // 古人言
  let y=wrapText(c,q[0],60,165,W-120,30);
  y+=30;
  c.font='13px "Microsoft YaHei",sans-serif';c.fillStyle='#c8d6e5';
  c.fillText('古 人 言  ·  THE ANCIENTS SAID',60,y);
  y+=8;
  c.font='bold 20px "KaiTi","STKaiti","Microsoft YaHei",serif';c.fillStyle='#f1f2f6';
  y=wrapText(c,q[1],60,y+30,W-120,32)+14;

function wrapText(c,text,x,y,maxW,lineH){
  const chars=String(text).split('');
  let line='',yy=y;
  for(let i=0;i<chars.length;i++){
    line+=chars[i];
    if(c.measureText(line).width>maxW){
      c.fillText(line.slice(0,-1),x,yy);
      line=chars[i];yy+=lineH;
    }
  }
  if(line)c.fillText(line,x,yy);
  return yy+lineH;
}
